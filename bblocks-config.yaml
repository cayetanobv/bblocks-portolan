# Portolan Building Blocks register configuration.
# Reference: https://github.com/opengeospatial/bblock-template/blob/master/USAGE.md

name: Portolan Building Blocks

abstract: |
  OGC Building Blocks for the [Portolan specification](https://github.com/portolan-sdi/portolan-spec):
  the Portolan STAC profile and the STAC extensions Portolan defines.

description: |
  Portolan is an open specification for cloud-native geospatial data catalogs. Every Portolan
  catalog is a static STAC catalog on plain HTTPS object storage, with cloud-native assets and
  guidance files that both people and AI agents read.

  This register wraps the published Portolan artifacts as Building Blocks. It does not redefine
  them. The schema of record is `https://schemas.portolan-sdi.org/portolan/<version>/schema.json`,
  the profile text lives in `portolan-spec/stac/README.md`, and rules the schema cannot express are
  checked by the [rashid](https://github.com/portolan-sdi/rashid) validator.

# First component names the maintainer (portolan-sdi), per the template guidance.
# The path under _sources/ completes each identifier, e.g. _sources/stac/profile -> portolan.stac.profile
identifier-prefix: portolan.

imports:
  - default
  - '@ogc/stac'

license:
  name: Apache-2.0
  url: https://www.apache.org/licenses/LICENSE-2.0

schema-oas30-downcompile: False

# Validator plugins: https://ogcincubator.github.io/bblocks-docs/create/validation#validator-plugins
# The rashid plugin (plugins/portolan-rashid) runs the rashid Portolan validator on each example and
# test file. Each rashid release checks one Portolan version, so the plugin is installed once per
# pin, each in its own virtualenv, and each copy handles only the blocks whose validation resource
# names its version. The pins follow portolan-spec, which validates its v0.2.0 release with rashid
# 0.1.8 and its v0.3.0 release with rashid 0.4.0. See SECURITY.md before changing these entries.
plugins:
  validators:
    - pip:
        - ./plugins/portolan-rashid
        - rashid @ git+https://github.com/portolan-sdi/rashid@v0.1.8
      modules:
        - portolan_bblocks_rashid
    - pip:
        - ./plugins/portolan-rashid
        - rashid @ git+https://github.com/portolan-sdi/rashid@v0.4.0
      modules:
        - portolan_bblocks_rashid
