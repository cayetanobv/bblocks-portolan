[project]
name = "portolan-bblocks"
version = "0.1.0"
description = "Check Portolan catalogs against the Portolan OGC Building Blocks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # OGC client: loads registers (and their imports) and finds blocks by identifier.
    "bblocks_client>=0.0.2",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
portolan-bblocks = "portolan_bblocks.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portolan_bblocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs the published register and schema hosts over https",
]
